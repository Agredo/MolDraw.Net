version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      nuget-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Keep the SkiaSharp family on one line: a major bump needs renderer changes and a new MAUI major, do it manually.
      - dependency-name: "SkiaSharp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "SkiaSharp.Views.Maui.Controls"
        update-types: ["version-update:semver-major"]
      - dependency-name: "SkiaSharp.NativeAssets.Linux"
        update-types: ["version-update:semver-major"]    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
